name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout SimdOnnxExt
        uses: actions/checkout@v4
        with:
          path: SimdOnnxExt

      # 引擎没有发布到 nuget.org：把它 checkout 成同级目录，Directory.Build.props 的
      # ..\SimdOnnx\src\Sdcb.SimdOnnx 才会解析到。ref 固定到已验证的提交，避免上游漂移。
      - name: Checkout Sdcb.SimdOnnx (engine)
        uses: actions/checkout@v4
        with:
          repository: sdcb/SimdOnnx
          path: SimdOnnx
          ref: f7318ef

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 图像门面走 nuget 0.1.0：ImageFacade 仓库的软后端 csproj 曾因注释里的双连字符（MSB4025）
      # 无法加载，修复推上去之前 CI 不能用本地通道。改好后把这一行删掉即可。
      - name: Restore
        working-directory: SimdOnnxExt
        run: dotnet restore SimdOnnxExt.slnx -p:UseLocalImageFacade=false

      - name: Build
        working-directory: SimdOnnxExt
        run: dotnet build SimdOnnxExt.slnx -c Release --no-restore -p:UseLocalImageFacade=false

      - name: Test
        working-directory: SimdOnnxExt
        run: dotnet test SimdOnnxExt.slnx -c Release --no-build --nologo -p:UseLocalImageFacade=false
